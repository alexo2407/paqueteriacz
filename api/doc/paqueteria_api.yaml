openapi: 3.0.3
info:
  title: PaqueteriaCZ API
  version: 1.2.0
  description: |
    API para autenticación (JWT) y gestión de pedidos.
    Incluye endpoints para login, listado de pedidos y creación de pedidos.
servers:
  - url: https://cruzvalle.website/api
paths:
  /api/auth/login:
    post:
      summary: Autenticar usuario y obtener token JWT
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
            example:
              email: admin@example.com
              password: secret123
      responses:
        '200':
          description: Token generado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Parámetros faltantes
        '401':
          description: Credenciales inválidas
  /api/pedidos/listar:
    get:
      summary: Obtener listado de pedidos extendido
      tags: [Pedidos]
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Número de página
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
          description: Cantidad de registros por página
        - in: query
          name: numero_orden
          schema:
            type: string
          description: Filtrar por número de orden (parcial)
        - in: query
          name: numero_cliente
          schema:
            type: integer
          description: Filtrar por ID de cliente (exacto)
      responses:
        '200':
          description: Listado de pedidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
        '500':
          description: Error interno
  /api/pedidos/status:
    get:
      summary: Consultar estado de jobs logísticos por pedido
      tags: [Pedidos]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: numero_orden
          schema:
            type: string
          description: Número de orden (modo single)
        - in: query
          name: numeros_orden
          schema:
            type: string
          description: Lista separada por comas (modo batch)
      responses:
        '200':
          description: Estado de jobs o resumen
        '401':
          description: Token inválido o ausente
        '404':
          description: Pedido no encontrado
  /api/pedidos/crear:
    post:
      summary: Crear un nuevo pedido
      tags: [Pedidos]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PedidoCreate'
            examples:
              con_recoleccion:
                summary: Pedido con datos de recolección (Origen)
                value:
                  numero_orden: "ORD-2026-101"
                  id_proveedor: 12
                  id_pais: 1
                  id_departamento: 161
                  id_municipio: 3800
                  destinatario: "Cliente Destino"
                  telefono: "+50588881234"
                  direccion: "Semáforos de Plaza España 1c al sur"
                  precio_total_local: 250.00
                  id_moneda: 1
                  productos:
                    - id_producto: 185
                      cantidad: 2
                      precio_unitario: 125.00
                  recoleccion:
                    id_pais: 1
                    id_departamento: 161
                    id_municipio: 3800
                    direccion: "Km 5 Carretera Norte, Bodega 4"
                    contacto: "Distribuidora Central S.A."
                    telefono: "+50522445566"
                    referencia: "Portón blanco con logo azul"
              estandar:
                summary: Pedido estándar sin recolección
                value:
                  numero_orden: 90001
                  destinatario: "Cliente Prueba"
                  telefono: "0999999999"
                  producto: "Producto X"
                  cantidad: 1
                  coordenadas: "-0.180653,-78.467838"
                  direccion: "Calle Falsa 123"
                  pais: "EC"
                  departamento: "Pichincha"
                  municipio: "Quito"
      responses:
        '200':
          description: Pedido creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateResponse'
        '400':
          description: Datos inválidos
        '401':
          description: Token inválido o expirado
        '422':
          description: Validación fallida
  /api/pedidos/actualizar:
    post:
      summary: Actualizar un pedido existente
      description: |
        Actualiza un pedido.
        Semántica de `recoleccion`:
        - Omitido: conserva la recolección existente.
        - Objeto: upsert/actualización parcial de la recolección.
        - `null`: elimina el registro de recolección.
        - `{}`: error de validación 422.
      tags: [Pedidos]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_pedido]
              properties:
                id_pedido:
                  type: integer
                destinatario:
                  type: string
                telefono:
                  type: string
                direccion:
                  type: string
                recoleccion:
                  $ref: '#/components/schemas/PedidoRecoleccion'
      responses:
        '200':
          description: Pedido actualizado exitosamente
        '401':
          description: No autenticado
        '403':
          description: No autorizado
        '422':
          description: Error de validación
  /api/pedidos/ver:
    get:
      summary: Consultar detalle de un pedido
      tags: [Pedidos]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: id
          schema:
            type: integer
          description: ID del pedido
        - in: query
          name: numero_orden
          schema:
            type: string
          description: Número de orden externo
      responses:
        '200':
          description: Detalle del pedido con objeto 'recoleccion' (o null si no tiene)
        '404':
          description: Pedido no encontrado
  /api/monedas/listar:
    get:
      summary: Listar monedas
      tags: [Monedas]
      responses:
        '200':
          description: Listado de monedas
  /api/monedas/ver:
    get:
      summary: Ver moneda por ID
      tags: [Monedas]
      parameters:
        - in: query
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Moneda encontrada
        '404':
          description: Moneda no encontrada
  /api/monedas/crear:
    post:
      summary: Crear moneda
      tags: [Monedas]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Moneda creada
        '401':
          description: Token inválido o ausente
  /api/monedas/actualizar:
    post:
      summary: Actualizar moneda
      tags: [Monedas]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Moneda actualizada
    put:
      summary: Actualizar moneda
      tags: [Monedas]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Moneda actualizada
  /api/monedas/eliminar:
    delete:
      summary: Eliminar moneda
      tags: [Monedas]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Moneda eliminada
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AuthRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required: [email, password]
    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            token:
              type: string
      example:
        success: true
        message: Login exitoso
        data:
          token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
    PedidoProduct:
      type: object
      properties:
        id_producto:
          type: integer
        cantidad:
          type: integer
        cantidad_devuelta:
          type: integer
    PedidoCreate:
      type: object
      properties:
        numero_orden:
          type: integer
        destinatario:
          type: string
        telefono:
          type: string
        direccion:
          type: string
        comentario:
          type: string
        producto:
          type: string
        cantidad:
          type: integer
        coordenadas:
          type: string
        pais:
          type: string
        departamento:
          type: string
        municipio:
          type: string
        precio_local:
          type: number
          format: float
        id_moneda:
          type: integer
        recoleccion:
          $ref: '#/components/schemas/PedidoRecoleccion'
      required: [numero_orden, destinatario, telefono, producto]
    PedidoRecoleccion:
      type: object
      description: Datos de recolección (origen del paquete).
      properties:
        id_pais:
          type: integer
          description: ID interno del país en el catálogo (o usar alias 'pais').
        id_departamento:
          type: integer
          description: ID interno del departamento (o usar alias 'departamento').
        id_municipio:
          type: integer
          description: ID interno del municipio (o usar alias 'municipio').
        pais:
          type: string
          description: Nombre del país para resolución automática.
        departamento:
          type: string
          description: Nombre del departamento para resolución automática.
        municipio:
          type: string
          description: Nombre del municipio para resolución automática.
        direccion:
          type: string
          description: Dirección completa del punto de recolección.
        contacto:
          type: string
          description: Nombre o negocio que entrega el paquete (opcional).
        telefono:
          type: string
          description: Teléfono de contacto en recolección (opcional, conserva formato internacional).
        referencia:
          type: string
          nullable: true
          description: Punto de referencia o indicaciones adicionales (opcional).
    PedidoItem:
      type: object
      properties:
        ID_Pedido:
          type: integer
        Numero_Orden:
          type: integer
        Cliente:
          type: string
        Comentario:
          type: string
        latitud:
          type: number
        longitud:
          type: number
        Estado:
          type: string
        PrecioLocal:
          type: number
        PrecioUSD:
          type: number
        Moneda:
          type: string
    ListResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/PedidoItem'
      example:
        success: true
        message: Listado de pedidos
        data:
          - ID_Pedido: 15
            Numero_Orden: 90001
            Cliente: Cliente Prueba
            Comentario: Entrega urgente
            latitud: -0.180653
            longitud: -78.467838
            Estado: Nuevo
            PrecioLocal: 25.5
            PrecioUSD: 9.5
            Moneda: USD
    CreateResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            pedido_id:
              type: integer
            numero_orden:
              type: string
      example:
        success: true
        message: Pedido creado correctamente.
        data:
          pedido_id: 28084
          numero_orden: "90001"
